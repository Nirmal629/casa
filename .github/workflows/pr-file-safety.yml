name: Production PR File Safety

on:
  pull_request:
    branches: [nir-prod]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block runtime files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > changed.txt
          if grep -E "(^|/)error_log$|(^|/)migration_(log|output)\.txt$|^admin/assets/images/tournaments_banner/|^assets/images/tournaments_banner/" changed.txt; then
            echo "Runtime files detected in PR"
            exit 1
          fi
          echo "PR file safety passed"
