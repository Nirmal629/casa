services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: casa_test
      MARIADB_USER: casa_test
      MARIADB_PASSWORD: casa_test123#
      MARIADB_ROOT_PASSWORD: localrootpassword
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./casa_test.sql:/docker-entrypoint-initdb.d/01-casa_test.sql:ro

  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
volumes:
  mariadb_data:
